name: jober

services:
  postgres:
    image: postgres:16-alpine
    container_name: jober-postgres
    environment:
      POSTGRES_DB: jober
      POSTGRES_USER: jober
      POSTGRES_PASSWORD: jober
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jober -d jober"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jober-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jober-backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:5173,localhost:5174,127.0.0.1,127.0.0.1:5173,127.0.0.1:5174
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: jober
      DB_USERNAME: jober
      DB_PASSWORD: jober
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: log
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: jober-dev-api-key-change-me
      CENTRIFUGO_TOKEN_HMAC_SECRET: jober-dev-client-secret-change-me
      CENTRIFUGO_TOKEN_TTL: "3600"
      CENTRIFUGO_PROXY_SECRET: jober-dev-proxy-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jober-queue
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: jober
      DB_USERNAME: jober
      DB_PASSWORD: jober
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: log
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: jober-dev-api-key-change-me
      CENTRIFUGO_TOKEN_HMAC_SECRET: jober-dev-client-secret-change-me
      CENTRIFUGO_TOKEN_TTL: "3600"
      CENTRIFUGO_PROXY_SECRET: jober-dev-proxy-secret
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started
    restart: unless-stopped

  pwa:
    build:
      context: ./pwa
      dockerfile: Dockerfile
    container_name: jober-pwa
    working_dir: /app
    volumes:
      - ./pwa:/app
      - pwa_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_CENTRIFUGO_PROXY_TARGET: http://centrifugo:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
      - centrifugo
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: jober-admin
    working_dir: /app
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    ports:
      - "5174:5174"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: jober-centrifugo
    command: centrifugo --config=/centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped

volumes:
  postgres_data:
    name: jober_pg16_data
  redis_data:
  pwa_node_modules:
  admin_node_modules:
